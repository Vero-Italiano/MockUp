<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vero Italiano - Sector-Refined Importer Prototype</title>
<style>
  :root{
    --bg:#faf7f2;--card-bg:#ffffff;--ink:#1f2a24;--muted:#636e68;--line:#e4ded3;
    --green:#2f5d3a;--green-light:#e7f0e5;--blue:#2c6b8a;--blue-light:#e7f0f5;
    --gold:#b8862b;--gold-light:#f8efdb;--red-it:#b7312c;--red-light:#fbe7e6;
    --panel-bg:#f1efe9;--shadow:0 4px 18px rgba(31,42,36,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14201a;--card-bg:#1c2b23;--ink:#eef2ee;--muted:#9fb0a5;--line:#2e4136;
      --green:#4f9464;--green-light:#22362a;--blue:#4a92b8;--blue-light:#1d323d;
      --gold:#d9a94b;--gold-light:#3a2f18;--red-it:#e2665f;--red-light:#3a2220;
      --panel-bg:#233229;--shadow:0 4px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14201a;--card-bg:#1c2b23;--ink:#eef2ee;--muted:#9fb0a5;--line:#2e4136;
    --green:#4f9464;--green-light:#22362a;--blue:#4a92b8;--blue-light:#1d323d;
    --gold:#d9a94b;--gold-light:#3a2f18;--red-it:#e2665f;--red-light:#3a2220;
    --panel-bg:#233229;--shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-block:32px;padding-inline:20px 20px;}
  .wrap{max-width:1200px;margin:0 auto;}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;}
  .h-left h1{font-size:22px;margin:0 0 4px;}
  .h-left p{color:var(--muted);font-size:13px;margin:0;max-width:650px;line-height:1.5;}
  .h-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .toggle, .lang-switch{display:flex;gap:4px;background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:3px;box-shadow:var(--shadow);}
  .toggle button, .lang-switch button{border:none;background:transparent;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;}
  .lang-switch button{padding:8px 12px;}
  .toggle button.active, .lang-switch button.active{background:var(--green);color:#fff;}
  .theme-toggle{border:1px solid var(--line);background:var(--card-bg);border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);}

  .ext-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;margin:0 0 14px;color:var(--muted);}
  .ext-nav a{color:var(--muted);text-decoration:none;font-weight:700;}
  .ext-nav a:hover{color:var(--green);}
  .ext-nav .ext-sep{color:var(--line);}
  .breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;margin:0 0 14px;color:var(--muted);}
  .breadcrumbs .crumb{color:var(--blue);text-decoration:none;cursor:pointer;}
  .breadcrumbs .crumb:hover{text-decoration:underline;}
  .breadcrumbs .crumb.current{color:var(--ink);font-weight:600;cursor:default;text-decoration:none;}
  .breadcrumbs .crumb-sep{color:var(--muted);opacity:.6;}

  /* Category Filter Tabs */
  .cat-bar{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card-bg);border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .cat-tabs{display:flex;flex-wrap:wrap;gap:6px;}
  .cat-tab{
    border:1px solid var(--line);background:var(--panel-bg);color:var(--ink);
    border-radius:18px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:all .12s ease;
  }
  .cat-tab:hover{border-color:var(--green);}
  .cat-tab.active{background:var(--green);color:#fff;border-color:var(--green);}
  .cat-count{
    font-size:10.5px;padding:1px 6px;border-radius:10px;
    background:rgba(0,0,0,0.08);
  }
  .cat-tab.active .cat-count{background:rgba(255,255,255,0.22);color:#fff;}

  .sources-toggle-btn{
    border:1px solid var(--blue);background:var(--blue-light);color:var(--blue);
    border-radius:18px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;
    white-space:nowrap;
  }
  .sources-toggle-btn:hover{opacity:.9;}

  /* Rating Scale Legend */
  .rating-legend{
    background:var(--card-bg);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .rl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .rl-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);}
  .rl-sub{font-size:11.5px;color:var(--muted);}
  .rl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;}
  .rl-tier{
    background:var(--panel-bg);border-radius:10px;padding:9px 11px;
    border-left:4px solid var(--green);font-size:11.5px;line-height:1.45;
  }
  .rl-tier-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
  .rl-code{
    font-size:10.5px;font-weight:800;color:#fff;padding:2px 6px;border-radius:5px;letter-spacing:.03em;
  }
  .rl-name{font-weight:700;color:var(--ink);font-size:12px;}
  .rl-desc{color:var(--muted);}

  /* Full Information Sources Panel */
  .sources-panel{
    display:none;background:var(--card-bg);border:1px solid var(--blue);
    border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .sources-panel.open{display:block;}
  .sp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .sp-head h3{margin:0;font-size:14px;color:var(--blue);}
  .sp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;}
  .sp-card{
    background:var(--panel-bg);border-radius:10px;padding:11px 13px;
    border-left:3px solid var(--blue);font-size:12px;line-height:1.48;
  }
  .sp-card strong{display:block;color:var(--ink);font-size:12.5px;margin-bottom:3px;}
  .sp-card .sp-feeds{font-size:11px;color:var(--blue);font-weight:700;margin-bottom:4px;}
  .sp-card p{margin:0;color:var(--muted);}

  .badge-note{background:var(--panel-bg);border:1px dashed var(--line);border-radius:12px;padding:9px 14px;font-size:11.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}

  /* Cards Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;}
  .lot-card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .12s ease;display:flex;flex-direction:column;}
  .lot-card:hover{transform:translateY(-3px);}
  .lot-img-wrap{position:relative;height:142px;background:var(--panel-bg);display:flex;align-items:center;justify-content:center;padding:12px;border-bottom:1px solid var(--line);}
  .lot-shield{position:absolute;top:8px;left:8px;}
  .lot-cat-pill{
    position:absolute;bottom:8px;left:8px;background:var(--card-bg);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:10px;font-weight:700;
  }
  .lot-lab-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--card-bg);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .lot-body{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1;}
  .lot-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:3px;}
  .lot-title{font-size:13.5px;font-weight:700;line-height:1.35;margin-bottom:8px;}
  .lot-status-row{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);}
  .lot-status-label{font-size:10px;color:var(--muted);margin-left:auto;font-weight:600;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .dot.confirmed{background:var(--green);}
  .dot.flagged{background:var(--red-it);}
  .dot.pending{background:var(--gold);}
  .dot.na{background:var(--line);}

  /* Modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(20,32,26,0.55);align-items:center;justify-content:center;padding:20px;z-index:60;}
  .overlay.open{display:flex;}
  .modal{background:var(--card-bg);border-radius:16px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;padding:26px 28px;box-shadow:0 12px 40px rgba(0,0,0,0.32);position:relative;}
  .modal-close{position:absolute;top:14px;right:16px;border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);}
  .modal-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .modal-thumb{width:62px;height:62px;background:var(--panel-bg);border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .modal-shield{flex-shrink:0;}
  .modal-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 3px;}
  .modal-title{font-size:17px;font-weight:700;margin:0;}
  .modal-desc{font-size:13px;color:var(--muted);line-height:1.55;margin:12px 0;}
  .modal-example{background:var(--panel-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px;}
  .modal-example strong{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}

  .section-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:16px 0 8px;}
  .section-h:first-of-type{margin-top:0;}

  .po-table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel-bg);border-radius:10px;overflow:hidden;}
  .po-table td{padding:8px 12px;border-bottom:1px solid var(--line);}
  .po-table tr:last-child td{border-bottom:none;}
  .po-table td:first-child{color:var(--muted);width:38%;}

  .evidence-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .evidence-row:first-of-type{border-top:none;}
  .ev-dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .ev-body h5{margin:0 0 2px;font-size:12.5px;}
  .ev-source{font-size:11px;color:var(--blue);font-weight:700;margin:0 0 3px;}
  .ev-body p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;}
  .ev-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:8px;margin-left:auto;flex-shrink:0;height:fit-content;}
  .ev-status.confirmed{background:var(--green-light);color:var(--green);}
  .ev-status.flagged{background:var(--red-light);color:var(--red-it);}
  .ev-status.pending{background:var(--gold-light);color:var(--gold);}
  .ev-status.na{background:var(--panel-bg);color:var(--muted);}

  .lab-strip{margin-top:14px;background:linear-gradient(135deg,var(--gold-light),var(--panel-bg));border:1px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--ink);}
  .lab-strip.pend{border-color:var(--muted);background:var(--panel-bg);}
  .lab-strip strong{display:block;font-size:12.5px;margin-bottom:4px;color:var(--gold);}
  .lab-strip.pend strong{color:var(--muted);}

  .cert-btn{margin-top:16px;width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .cert-btn:hover{opacity:.92;}

  .cert{border:2px solid var(--green);border-radius:14px;padding:20px;margin-top:16px;background:var(--card-bg);}
  .cert-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
  .cert-head h4{margin:0;font-size:15px;}
  .cert-flag{font-size:11px;color:var(--muted);text-align:right;font-weight:700;}
  .cert-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);gap:10px;}
  .cert-row span:first-child{color:var(--muted);flex-shrink:0;}
  .cert-row span:last-child{text-align:right;font-weight:500;}

  .view{display:none;}
  .view.active{display:block;}

  /* Lab Queue */
  .queue-card{background:var(--card-bg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;}
  .queue-top{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .queue-thumb{width:50px;height:50px;background:var(--panel-bg);border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .queue-title{font-size:13.5px;font-weight:700;}
  .queue-sub{font-size:11.5px;color:var(--muted);}
  .lab-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .lab-form label{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:block;margin-bottom:3px;font-weight:700;}
  .lab-form select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--bg);color:var(--ink);}
  .lab-form .full{grid-column:1/-1;}
  .submit-btn{margin-top:12px;background:var(--gold);color:#3a2a08;border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .empty-queue{color:var(--muted);font-size:13px;padding:30px 0;text-align:center;}
  .done-tag{background:var(--green-light);color:var(--green);font-size:11px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:8px;margin-left:auto;flex-shrink:0;}

  /* Intake view */
  .intake-card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .intake-head{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;}
  .intake-thumb{width:44px;height:44px;background:var(--panel-bg);border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .intake-head-title{font-size:13.5px;font-weight:700;}
  .intake-head-sub{font-size:11.5px;color:var(--muted);}
  .intake-shield{flex-shrink:0;}
  .intake-caret{margin-left:auto;color:var(--muted);font-size:13px;transition:transform .15s ease;flex-shrink:0;}
  .intake-card.open .intake-caret{transform:rotate(90deg);}
  .intake-body{display:none;padding:0 18px 18px;}
  .intake-card.open .intake-body{display:block;}
  .flow-note{font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-style:italic;}

  .pending-section-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:0 0 8px;}
  .pending-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .pending-row{display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);}
  .pending-thumb{width:38px;height:38px;background:var(--panel-bg);border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pending-title{font-size:12.5px;font-weight:700;}
  .pending-sub{font-size:11px;color:var(--muted);}
  .pending-upload-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;margin-left:auto;
    background:var(--green);color:#fff;border:none;border-radius:9px;padding:8px 14px;
    font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .pending-upload-btn:disabled{background:var(--panel-bg);color:var(--muted);cursor:not-allowed;}
  .pending-upload-btn:not(:disabled):hover{opacity:.92;}
  .all-imported-note{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .empty-intake{border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .checking{color:var(--muted);font-style:italic;}
  .parsing-row{display:flex;align-items:center;gap:10px;padding:14px 0;color:var(--muted);font-size:12.5px;font-style:italic;}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--green);animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .just-imported{background:var(--green-light);color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:8px;margin-left:8px;}

  @media (max-width:680px){
    .lab-form{grid-template-columns:1fr;}
    .po-table td:first-child{width:46%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="ext-nav">
    <a href="https://vero-italiano.github.io/Vero-/" id="ext-nav-home"></a>
    <span class="ext-sep">&middot;</span>
    <a href="https://vero-italiano.github.io/Spettro-di-Autenticita/" id="ext-nav-spectrum"></a>
    <span class="ext-sep">&middot;</span>
    <a href="https://vero-italiano.github.io/MVP-/" id="ext-nav-mvp"></a>
  </nav>
  <header>
    <div class="h-left">
      <h1 id="t-h1"></h1>
      <p id="t-sub"></p>
    </div>
    <div class="h-right">
      <div class="lang-switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <button id="btn-it" onclick="setLang('it')">IT</button>
      </div>
      <div class="toggle">
        <button id="btn-intake" onclick="setView('intake')"></button>
        <button id="btn-importer" class="active" onclick="setView('importer')"></button>
        <button id="btn-lab" onclick="setView('lab')"></button>
      </div>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">&#127769;</button>
    </div>
  </header>

  <nav class="breadcrumbs" id="breadcrumbs"></nav>

  <!-- Product Category Filter & Information Sources Toggle -->
  <div class="cat-bar">
    <div class="cat-tabs" id="cat-tabs"></div>
    <button class="sources-toggle-btn" id="sources-toggle-btn" onclick="toggleSourcesPanel()"></button>
  </div>

  <!-- Expandable Full Information Sources Directory -->
  <div class="sources-panel" id="sources-panel"></div>

  <!-- Category-Specific Rating Scale Legend -->
  <div class="rating-legend" id="rating-legend"></div>

  <div class="badge-note" id="t-note"></div>

  <div id="view-intake" class="view">
    <div id="pending-section"></div>
    <div id="pending-list"></div>
    <div id="intake-list"></div>
  </div>

  <div id="view-importer" class="view active">
    <div class="grid" id="lot-grid"></div>
  </div>

  <div id="view-lab" class="view">
    <div id="lab-queue"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
var lang = 'en';
var activeCategory = 'all';
var openLotId = null;
var openIntakeId = null;
var currentView = 'importer';
var sourcesPanelOpen = false;
var certOpen = false;

var ui = {
  en: {
    h1: "Vero Italiano - Sector-Refined Importer Prototype",
    sub: "Filter by product category to inspect sector-specific rating scales, the full 6-pillar set of forensic & digital information sources, Purchase Order intake checks, and ISO 17025 lab workflows.",
    note: "Demo data only. Purchase orders, 6-stream evidence evaluations, and laboratory assays shown below illustrate Vero Italiano's category-specific decision logic.",
    intakeBtn: "Intake & Validation",
    importerBtn: "Certified Results",
    labBtn: "Lab Partner View",
    sourcesBtnShow: "Inspect All 6 Information Sources",
    sourcesBtnHide: "Hide Information Sources",
    sourcesPanelTitle: "Full Set of Information Sources Used for Authentication Decisions",
    sourcesPanelClose: "Close",
    method: "Analytical Method",
    result: "Assay Result",
    custody: "Chain of Custody & Accreditation",
    resultOptions: ["Consistent with declared origin & composition", "Inconsistent / Adulteration or origin mismatch detected"],
    custodyOptions: ["Confirmed — ISO 17025 / ILAC MRA accredited partner", "Not confirmed"],
    submitBtn: "Submit Lab Result",
    submitted: "Submitted",
    emptyQueue: "No test requests currently in queue for this category.",
    testRequested: "{CAT} · Rating {R} lot — forensic test requested by importer",
    viewCert: "View exportable Lot Passport & Certificate",
    hideCert: "Hide certificate",
    certTitle: "Vero Italiano Lot Passport & Certificate",
    certCategory: "Product Category",

/* Crisp custom vector illustrations per sector so no external images ever break */
function productSVG(cat, variant){
  if(cat === 'tomato'){
    var labelCol = variant === 'bad' ? '#b7312c' : (variant === 'warn' ? '#b8862b' : '#2f5d3a');
    return '<svg viewBox="0 0 96 96" width="84" height="84">' +
      '<rect x="24" y="16" width="48" height="64" rx="6" fill="#e6e2d8" stroke="#9aa39e" stroke-width="2"/>' +
      '<ellipse cx="48" cy="16" rx="24" ry="4" fill="#cfd5d1" stroke="#9aa39e" stroke-width="1.5"/>' +
      '<rect x="25" y="30" width="46" height="36" fill="' + labelCol + '"/>' +
      '<circle cx="48" cy="48" r="11" fill="#d93829"/>' +
      '<path d="M44 38 Q48 33 52 38" stroke="#2f5d3a" stroke-width="2.5" fill="none"/>' +
      '</svg>';
  }
  if(cat === 'olive'){
    var glassCol = variant === 'bad' ? '#8c6d3f' : '#3a5f32';
    return '<svg viewBox="0 0 96 96" width="84" height="84">' +
      '<rect x="42" y="10" width="12" height="16" rx="2" fill="#b8862b"/>' +
      '<path d="M42 26 L32 38 L32 82 C32 85 35 86 48 86 C61 86 64 85 64 82 L64 38 L54 26 Z" fill="' + glassCol + '"/>' +
      '<rect x="35" y="46" width="26" height="24" rx="2" fill="#faf7f2"/>' +
      '<circle cx="48" cy="58" r="6" fill="#7c9a3e"/>' +
      '</svg>';
  }
  if(cat === 'cheese'){
    var rindCol = variant === 'fresh' ? '#f5f2eb' : '#d8a648';
    var pasteCol = variant === 'fresh' ? '#ffffff' : '#f7e4a8';
    return '<svg viewBox="0 0 96 96" width="84" height="84">' +
      '<ellipse cx="48" cy="36" rx="34" ry="14" fill="' + pasteCol + '" stroke="' + rindCol + '" stroke-width="3"/>' +
      '<path d="M14 36 L14 62 C14 70 29 76 48 76 C67 76 82 70 82 62 L82 36 C82 44 67 50 48 50 C29 50 14 44 14 36 Z" fill="' + rindCol + '"/>' +
      '<rect x="32" y="54" width="32" height="12" rx="3" fill="#faf7f2" opacity="0.85"/>' +
      '</svg>';
  }
  /* wine */
  var capCol = variant === 'bad' ? '#b7312c' : '#7a1f24';
  return '<svg viewBox="0 0 96 96" width="84" height="84">' +
    '<rect x="43" y="8" width="10" height="22" rx="2" fill="' + capCol + '"/>' +
    '<path d="M43 30 C35 34 34 42 34 48 L34 84 C34 86 38 87 48 87 C58 87 62 86 62 84 L62 48 C62 42 61 34 53 30 Z" fill="#233127"/>' +
    '<rect x="36" y="50" width="24" height="24" rx="2" fill="#faf7f2"/>' +
    '<line x1="40" y1="58" x2="56" y2="58" stroke="#7a1f24" stroke-width="2"/>' +
    '<line x1="40" y1="64" x2="52" y2="64" stroke="#6b7570" stroke-width="1.5"/>' +
    '</svg>';
}

var importedIds = [];
var parsingId = null;
var revealingId = null;
var checkedKeys = [];
var sixKeys = ['reg','sdi','fin','sat','custody','lab'];

function t(){ return ui[lang]; }
function statusClass(st){ return st === 'verified' ? 'confirmed' : st; }

function shieldSVG(color, code, size){
  size = size || 38;
  var h = Math.round(size * 72 / 64);
  var fSize = code.length > 2 ? 18 : 23;
  return '<svg viewBox="0 0 64 72" width="' + size + '" height="' + h + '">' +
    '<path d="M32 2 L60 12 L60 34 C60 54 48 66 32 70 C16 66 4 54 4 34 L4 12 Z" fill="' + color + '" stroke="#1f2a24" stroke-opacity="0.18" stroke-width="2"/>' +
    '<text x="32" y="42" text-anchor="middle" font-size="' + fSize + '" font-weight="800" fill="#ffffff" font-family="-apple-system,Helvetica,Arial,sans-serif">' + code + '</text>' +
    '</svg>';
}

function visibleLots(){
  if(activeCategory === 'all') return lots;
  return lots.filter(function(l){ return l.category === activeCategory; });
}

function viewLabel(){
  return currentView === 'intake' ? t().intakeBtn : (currentView === 'lab' ? t().labBtn : t().importerBtn);
}

function crumbGoView(){
  openIntakeId = null;
  closeModal();
  renderIntakeList();
  renderBreadcrumbs();
}
function crumbGoLot(){
  certOpen = false;
  renderCert();
  renderBreadcrumbs();
}

function renderBreadcrumbs(){
  var nav = document.getElementById('breadcrumbs');
  if(!nav) return;
  var crumbs = [];
  var anythingOpen = !!openLotId || (currentView === 'intake' && !!openIntakeId);
  crumbs.push({label: viewLabel(), onclick: anythingOpen ? 'crumbGoView()' : null});

  if(activeCategory !== 'all'){
    crumbs.push({label: categories[activeCategory].label[lang], onclick: anythingOpen ? 'crumbGoView()' : null});
  }

  if(currentView === 'intake' && openIntakeId){
    var iLot = lots.find(function(l){ return l.id === openIntakeId; });
    if(iLot){ crumbs.push({label: t().crumbPo.replace('{L}', iLot.po.lot), onclick: null}); }
  }
  if(openLotId){
    var lot = lots.find(function(l){ return l.id === openLotId; });
    if(lot){
      crumbs.push({label: lot.code + ': ' + lot.tag[lang], onclick: certOpen ? 'crumbGoLot()' : null});
      if(certOpen){ crumbs.push({label: t().certTitle, onclick: null}); }
    }
  }

  nav.innerHTML = crumbs.map(function(c, i){
    var isLast = (i === crumbs.length - 1);
    if(isLast || !c.onclick){
      return '<span class="crumb current">' + c.label + '</span>';
    }
    return '<a href="#" class="crumb" onclick="event.preventDefault(); ' + c.onclick + '">' + c.label + '</a>';
  }).join('<span class="crumb-sep">&rsaquo;</span>');
}

function renderStaticText(){
  document.getElementById('t-h1').textContent = t().h1;
  document.getElementById('t-sub').textContent = t().sub;
  document.getElementById('t-note').textContent = t().note;
  document.getElementById('btn-intake').textContent = t().intakeBtn;
  document.getElementById('btn-importer').textContent = t().importerBtn;
  document.getElementById('btn-lab').textContent = t().labBtn;
  document.getElementById('ext-nav-home').textContent = t().navHome;
  document.getElementById('ext-nav-spectrum').textContent = t().navSpectrum;
  document.getElementById('ext-nav-mvp').textContent = t().navMvp;
  document.getElementById('sources-toggle-btn').textContent = sourcesPanelOpen ? t().sourcesBtnHide : t().sourcesBtnShow;
}

function renderCategoryBar(){
  var tabsEl = document.getElementById('cat-tabs');
  var order = ['all','tomato','olive','cheese','wine'];
  tabsEl.innerHTML = order.map(function(cid){
    var count = cid === 'all' ? lots.length : lots.filter(function(l){ return l.category === cid; }).length;
    var activeCls = (activeCategory === cid) ? ' active' : '';
    return '<button class="cat-tab' + activeCls + '" onclick="setCategory(\'' + cid + '\')">' +
      categories[cid].label[lang] + ' <span class="cat-count">' + count + '</span></button>';
  }).join('');
}

function renderRatingLegend(){

    return '<div class="rl-tier" style="border-left-color:' + tr.color + ';">' +
      '<div class="rl-tier-top"><span class="rl-code" style="background:' + tr.color + ';">' + tr.code + '</span>' +
      '<span class="rl-name">' + tr.name[lang] + '</span></div>' +

function renderSourcesPanel(){
  var panel = document.getElementById('sources-panel');
  panel.classList.toggle('open', sourcesPanelOpen);
  if(!sourcesPanelOpen) return;
  var cardsHtml = infoSourcesDirectory.map(function(src){
    return '<div class="sp-card">' +

function toggleSourcesPanel(){
  sourcesPanelOpen = !sourcesPanelOpen;
  renderStaticText();
  renderSourcesPanel();
}

function setCategory(cid){
  activeCategory = cid;
  renderCategoryBar();
  renderRatingLegend();
  renderIntakeList();
  renderGrid();
  renderLabQueue();
  renderBreadcrumbs();
}

/* ---------- Intake & Validation view ---------- */
function renderPendingList(){
  var sectionEl = document.getElementById('pending-section');
  var listEl = document.getElementById('pending-list');
  var busy = (parsingId !== null || revealingId !== null);
  var pending = visibleLots().filter(function(l){ return importedIds.indexOf(l.id) === -1; });

  if(pending.length === 0){
    sectionEl.innerHTML = '';
    listEl.innerHTML = '<div class="all-imported-note">' + t().allImported + '</div>';
    return;
  }

  sectionEl.innerHTML = '<div class="pending-section-h">' + t().pendingSection + '</div>';
  listEl.innerHTML = '';
  pending.forEach(function(lot){
    var row = document.createElement('div');
    row.className = 'pending-row';
    row.innerHTML =
      '<div class="pending-thumb">' + productSVG(lot.category, lot.iconVar).replace('width="84" height="84"', 'width="30" height="30"') + '</div>' +
      '<div><div class="pending-title">' + lot.title[lang] + '</div>' +
      '<div class="pending-sub">' + categories[lot.category].label[lang] + ' &middot; PO ' + lot.po.lot + '</div></div>' +
      '<button class="pending-upload-btn"' + (busy ? ' disabled' : '') + ' onclick="uploadPO(\'' + lot.id + '\')">&#8593; ' + t().uploadAction + '</button>';
    listEl.appendChild(row);
  });
}

function renderIntakeList(){
  renderPendingList();
  var container = document.getElementById('intake-list');
  var visibleIds = importedIds.filter(function(id){
    var l = lots.find(function(x){ return x.id === id; });
    return l && (activeCategory === 'all' || l.category === activeCategory);
  });

  if(visibleIds.length === 0){
    container.innerHTML = '<div class="empty-intake">' + t().emptyIntake + '</div>';
    return;
  }
  container.innerHTML = '';
  visibleIds.forEach(function(id){
    var lot = lots.find(function(l){ return l.id === id; });
    var card = document.createElement('div');
    card.className = 'intake-card' + (openIntakeId === lot.id ? ' open' : '');
    var justTag = (id === importedIds[0] && (revealingId === id || parsingId === id)) ? '<span class="just-imported">' + t().justImported + '</span>' : '';
    var headHtml =
      '<div class="intake-head" onclick="toggleIntake(\'' + lot.id + '\')">' +
        '<div class="intake-thumb">' + productSVG(lot.category, lot.iconVar).replace('width="84" height="84"', 'width="34" height="34"') + '</div>' +
        '<div><div class="intake-head-title">' + lot.title[lang] + justTag + '</div>' +
        '<div class="intake-head-sub">' + categories[lot.category].label[lang] + ' &middot; PO ' + lot.po.lot + ' &middot; ' + t().clickToExpand + '</div></div>' +
        '<div class="intake-shield">' + shieldSVG(lot.color, lot.code, 32) + '</div>' +
        '<span class="intake-caret">&#9654;</span>' +
      '</div>';
    var bodyHtml = '<div class="intake-body">' + intakeBodyHTML(lot) + '</div>';
    card.innerHTML = headHtml + bodyHtml;
    container.appendChild(card);
  });
}

function toggleIntake(id){
  openIntakeId = (openIntakeId === id) ? null : id;
  renderIntakeList();
  renderBreadcrumbs();
}

function intakeBodyHTML(lot){
  if(parsingId === lot.id){
    return '<div class="parsing-row"><span class="spin"></span>' + t().parsing + '</div>';
  }
  var po = lot.po;
  var poRows = [
    [t().poProduct, po.product[lang]],
    [t().poVolume, po.volume[lang]],
    [t().poOrigin, po.origin[lang]],
    [t().poLot, po.lot],
    [t().poHs, po.hs],
    [t().poSupplier, po.supplier]
  ].map(function(r){ return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');

  var isRevealing = (revealingId === lot.id);
  var reqRows = sixKeys.map(function(k){
    var e = lot.evidence[k];
    if(isRevealing && checkedKeys.indexOf(k) === -1){
      return '<div class="evidence-row"><span class="ev-dot dot pending"></span>' +
        '<div class="ev-body"><h5>' + e.label[lang] + '</h5><p class="checking">' + t().checking + '</p></div></div>';
    }
    var cls = statusClass(e.status);
    return '<div class="evidence-row"><span class="ev-dot dot ' + cls + '"></span>' +
      '<div class="ev-body"><h5>' + e.label[lang] + '</h5><div class="ev-source">' + e.source[lang] + '</div><p>' + e.note[lang] + '</p></div>' +
      '<span class="ev-status ' + cls + '">' + t().statusLabel[e.status] + '</span></div>';
  }).join('');

  var resultHtml = '';
  if(!(isRevealing && checkedKeys.length < sixKeys.length)){
    var isRejected = lot.code.endsWith('0');
    var resultText = (isRejected ? t().resultLineRejected : t().resultLine)
      .replace('{R}', lot.code)
      .replace('{T}', lot.tag[lang]);
    resultHtml = '<div class="section-h">' + t().resultSection + '</div>' +
      '<div class="modal-example" style="display:flex;align-items:center;gap:12px;margin-bottom:0;">' +
        '<div style="flex-shrink:0;">' + shieldSVG(lot.color, lot.code, 34) + '</div>' +
        '<span>' + resultText + '</span>' +
      '</div>' +
      '<div class="flow-note"><a href="#" onclick="event.preventDefault(); openModal(\'' + lot.id + '\');">' + t().openInResults + '</a></div>';
  }

  return '<div class="section-h">' + t().poSection + '</div>' +
    '<table class="po-table">' + poRows + '</table>' +
    '<div class="section-h">' + t().reqSection + '</div>' +
    reqRows +
    resultHtml;
}

function uploadPO(id){
  if(importedIds.indexOf(id) !== -1) return;
  var lot = lots.find(function(l){ return l.id === id; });
  if(!lot) return;
  importedIds.unshift(lot.id);
  openIntakeId = lot.id;
  parsingId = lot.id;
  revealingId = null;
  checkedKeys = [];
  renderIntakeList();
  renderBreadcrumbs();
  setTimeout(function(){
    parsingId = null;
    revealingId = lot.id;
    renderIntakeList();
    revealNext(lot.id, sixKeys, 0);
  }, 750);
}

function revealNext(lotId, keys, idx){
  if(idx >= keys.length){
    revealingId = null;
    renderIntakeList();
    return;
  }
  checkedKeys.push(keys[idx]);
  renderIntakeList();
  setTimeout(function(){ revealNext(lotId, keys, idx + 1); }, 380);
}

/* ---------- Certified Results (importer) view ---------- */
function renderGrid(){
  var grid = document.getElementById('lot-grid');
  grid.innerHTML = '';
  visibleLots().forEach(function(lot){
    var card = document.createElement('div');
    card.className = 'lot-card';
    card.onclick = function(){ openModal(lot.id); };
    var labBadge = lot.evidence.lab.status === 'verified' ? '<div class="lot-lab-badge" title="' + t().labVerified + '">&#129514;</div>' : '';
    var dots = sixKeys.map(function(k){
      var st = lot.evidence[k].status;
      return '<span class="dot ' + statusClass(st) + '" title="' + lot.evidence[k].label[lang] + ': ' + t().statusLabel[st] + '"></span>';
    }).join('');
    card.innerHTML =
      '<div class="lot-img-wrap">' +
        '<div class="lot-shield">' + shieldSVG(lot.color, lot.code, 36) + '</div>' +
        labBadge +
        productSVG(lot.category, lot.iconVar) +
        '<span class="lot-cat-pill">' + categories[lot.category].label[lang] + '</span>' +
      '</div>' +
      '<div class="lot-body">' +
        '<div class="lot-tag">' + lot.code + ' &middot; ' + lot.tag[lang] + '</div>' +
        '<div class="lot-title">' + lot.title[lang] + '</div>' +
        '<div class="lot-status-row">' + dots + '<span class="lot-status-label">' + t().sixDotsHint + '</span></div>' +
      '</div>';
    grid.appendChild(card);
  });
}

function evidenceRowsHTML(lot){
  return sixKeys.map(function(k){
    var e = lot.evidence[k];
    var cls = statusClass(e.status);
    return '<div class="evidence-row"><span class="ev-dot dot ' + cls + '"></span>' +
      '<div class="ev-body"><h5>' + e.label[lang] + '</h5><div class="ev-source">' + e.source[lang] + '</div><p>' + e.note[lang] + '</p></div>' +
      '<span class="ev-status ' + cls + '">' + t().statusLabel[e.status] + '</span></div>';
  }).join('');
}

function openModal(id){
  openLotId = id;
  certOpen = false;
  renderModal();
  document.getElementById('overlay').classList.add('open');
  renderBreadcrumbs();
}

function renderModal(){
  if(!openLotId) return;
  var lot = lots.find(function(l){ return l.id === openLotId; });
  var body = document.getElementById('modal-content');
  var labBadgeHtml = lot.evidence.lab.status === 'verified'
    ? '<div class="lab-strip"><strong>&#129514; ' + t().labVerified + '</strong>' + lot.evidence.lab.note[lang] + '</div>'
    : (lot.evidence.lab.status === 'pending'
      ? '<div class="lab-strip pend"><strong>&#8987; ' + t().labPending + '</strong>' + lot.evidence.lab.note[lang] + '</div>'
      : '');

  body.innerHTML =
    '<div class="modal-top">' +
      '<div class="modal-thumb">' + productSVG(lot.category, lot.iconVar).replace('width="84" height="84"', 'width="48" height="48"') + '</div>' +
      '<div class="modal-shield">' + shieldSVG(lot.color, lot.code, 44) + '</div>' +
      '<div><div class="modal-tag">' + categories[lot.category].label[lang] + ' &middot; ' + lot.code + ' &middot; ' + lot.tag[lang] + '</div>' +
      '<h3 class="modal-title">' + lot.title[lang] + '</h3></div>' +
    '</div>' +
    '<p class="modal-desc">' + lot.desc[lang] + '</p>' +
    '<div class="modal-example"><strong>' + t().context + '</strong>' + lot.example[lang] + '</div>' +
    '<div class="section-h">' + t().reqSection + '</div>' +
    evidenceRowsHTML(lot) +
    labBadgeHtml +
    '<button class="cert-btn" id="cert-toggle-btn" onclick="toggleCert()">' + t().viewCert + '</button>' +
    '<div id="cert-area"></div>';
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  openLotId = null;
  renderBreadcrumbs();
}
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id === 'overlay') closeModal(); });

function toggleCert(){
  certOpen = !certOpen;
  renderCert();
  renderBreadcrumbs();
  if(certOpen){
    setTimeout(function(){
      var area = document.getElementById('cert-area');
      if(area) area.scrollIntoView({behavior:'smooth', block:'start'});
    }, 30);
  }
}
function renderCert(){
  var area = document.getElementById('cert-area');
  var btn = document.getElementById('cert-toggle-btn');
  if(!area) return;
  if(!certOpen){ area.innerHTML = ''; if(btn) btn.textContent = t().viewCert; return; }
  if(btn) btn.textContent = t().hideCert;
  var lot = lots.find(function(l){ return l.id === openLotId; });
  if(!lot) return;
  var hasFlag = sixKeys.some(function(k){ return lot.evidence[k].status === 'flagged'; });
  var overallStatus = hasFlag ? t().discrepancies : t().noDiscrepancies;
  var borderCol = hasFlag ? 'var(--red-it)' : 'var(--green)';
  var anchorHash = certHash(lot);

  var sourceRows = sixKeys.map(function(k){
    var ev = lot.evidence[k];
    return '<div class="cert-row"><span>' + ev.label[lang] + '</span><span>' + t().statusLabel[ev.status] + '</span></div>';
  }).join('');

  area.innerHTML =
    '<div class="cert" style="border-color:' + borderCol + ';">' +
      '<div class="cert-head"><h4>' + t().certTitle + '</h4><span class="cert-flag" style="color:' + borderCol + ';">' + overallStatus + '</span></div>' +
      '<div class="cert-row"><span>' + t().certCategory + '</span><span>' + categories[lot.category].label[lang] + '</span></div>' +
      '<div class="cert-row"><span>' + t().certProduct + '</span><span>' + lot.title[lang] + '</span></div>' +
      '<div class="cert-row"><span>' + t().poLot + '</span><span>' + lot.po.lot + '</span></div>' +
      '<div class="cert-row"><span>' + t().certLevel + '</span><span><strong>' + lot.code + ' — ' + lot.tag[lang] + '</strong></span></div>' +
      sourceRows +
      '<div class="cert-row"><span>' + t().certLab + '</span><span>' + (lot.evidence.lab.status === 'verified' ? t().certYes : t().certNo) + '</span></div>' +
      '<div class="cert-row"><span>' + t().certIssued + '</span><span>' + t().certIssuedNote + '</span></div>' +
      '<div class="cert-row" style="border-bottom:none;"><span>' + t().certAnchor + '</span><span style="font-family:monospace;font-size:12px;" title="' + t().certAnchorNote + '">' + anchorHash + '</span></div>' +
    '</div>';
}

function certHash(lot){
  var src = lot.id + '|' + lot.code + '|' + lot.po.lot + '|' + sixKeys.map(function(k){ return lot.evidence[k].status; }).join('|');
  var h = 0;
  for(var i = 0; i < src.length; i++){ h = ((h << 5) - h + src.charCodeAt(i)) | 0; }
  var hex = (h >>> 0).toString(16);
  while(hex.length < 8){ hex = '0' + hex; }
  return '0x' + hex + '...' + lot.po.lot.replace(/[^A-Za-z0-9]/g,'').slice(-6).toLowerCase();
}

/* ---------- Lab Partner view (Sector-Specific Assays) ---------- */
function renderLabQueue(){
  var container = document.getElementById('lab-queue');
  var scoped = visibleLots();
  var pending = scoped.filter(function(l){ return l.evidence.lab.status === 'pending'; });
  var verified = scoped.filter(function(l){ return l.evidence.lab.status === 'verified'; });

  var html = '';
  if(pending.length === 0 && verified.length === 0){
    html += '<div class="empty-queue">' + t().emptyQueue + '</div>';
  }
  pending.forEach(function(lot){
    var subText = t().testRequested
      .replace('{CAT}', categories[lot.category].label[lang])
      .replace('{R}', lot.code);
    var methods = categories[lot.category].labMethods[lang];
    html +=
      '<div class="queue-card">' +
        '<div class="queue-top">' +
          '<div class="queue-thumb">' + productSVG(lot.category, lot.iconVar).replace('width="84" height="84"', 'width="36" height="36"') + '</div>' +
          '<div><div class="queue-title">' + lot.title[lang] + '</div><div class="queue-sub">' + subText + '</div></div>' +
        '</div>' +
        '<div class="lab-form">' +
          '<div><label>' + t().method + '</label><select id="method-' + lot.id + '">' + methods.map(function(o){ return '<option>' + o + '</option>'; }).join('') + '</select></div>' +
          '<div><label>' + t().result + '</label><select id="result-' + lot.id + '">' + t().resultOptions.map(function(o){ return '<option>' + o + '</option>'; }).join('') + '</select></div>' +
          '<div class="full"><label>' + t().custody + '</label><select id="custody-' + lot.id + '">' + t().custodyOptions.map(function(o){ return '<option>' + o + '</option>'; }).join('') + '</select></div>' +
        '</div>' +
        '<button class="submit-btn" onclick="submitLabResult(\'' + lot.id + '\')">' + t().submitBtn + '</button>' +
      '</div>';
  });
  verified.forEach(function(lot){
    html +=
      '<div class="queue-card" style="border-left-color:var(--green);opacity:.82;">' +
        '<div class="queue-top">' +
          '<div class="queue-thumb">' + productSVG(lot.category, lot.iconVar).replace('width="84" height="84"', 'width="36" height="36"') + '</div>' +
          '<div><div class="queue-title">' + lot.title[lang] + '</div>' +
          '<div class="queue-sub">' + categories[lot.category].label[lang] + ' &middot; ' + lot.code + ' &middot; ' + lot.tag[lang] + '</div></div>' +
          '<span class="done-tag">' + t().submitted + '</span>' +
        '</div>' +
      '</div>';
  });
  container.innerHTML = html;
}

function submitLabResult(id){
  var lot = lots.find(function(l){ return l.id === id; });
  var resultSelect = document.getElementById('result-' + id);
  var custodySelect = document.getElementById('custody-' + id);
  var methodSelect = document.getElementById('method-' + id);
  var resultIdx = resultSelect.selectedIndex;
  var custodyIdx = custodySelect.selectedIndex;
  var methodIdx = methodSelect.selectedIndex;
  var consistent = (resultIdx === 0);
  var confirmed = (custodyIdx === 0);
  var methodText = categories[lot.category].labMethods[lang][methodIdx];

  if(consistent && confirmed){
    lot.evidence.lab.status = 'verified';
    lot.evidence.lab.note = {
      en: methodText + " confirms result consistent with declared origin and composition. ISO 17025 chain of custody verified.",
      it: methodText + " conferma esito coerente con origine e composizione dichiarate. Catena di custodia ISO 17025 verificata."
    };
    /* Upgrade eligible W2 wine lot to W1 Single-Vineyard / Lab-Verified upon clean lab pass */
    if(lot.id === 'w2'){
      lot.code = 'W1';
      lot.color = '#1f6b3a';
      lot.tag = {en:"Appellation & Varietal Lab-Verified", it:"Denominazione e Varietale Lab-Verified"};
    }
  } else {
    lot.evidence.lab.status = 'flagged';
    lot.code = lot.category.charAt(0).toUpperCase() + '0';
    lot.color = '#b7312c';
    lot.tag = categories[lot.category].tiers[3].name;
    lot.evidence.lab.note = {
      en: methodText + " flagged discrepancy: " + t().resultOptions[resultIdx].toLowerCase() + ". Custody: " + t().custodyOptions[custodyIdx].toLowerCase() + ".",
      it: methodText + " ha rilevato difformita: " + t().resultOptions[resultIdx].toLowerCase() + ". Custodia: " + t().custodyOptions[custodyIdx].toLowerCase() + "."
    };
  }
  renderLabQueue();
  renderGrid();
  if(openIntakeId === id) renderIntakeList();
}

/* ---------- View / lang / theme switching ---------- */
function setView(view){
  currentView = view;
  ['intake','importer','lab'].forEach(function(v){
    document.getElementById('view-' + v).classList.toggle('active', v === view);
    document.getElementById('btn-' + v).classList.toggle('active', v === view);
  });
  renderBreadcrumbs();
}

function setLang(newLang){
  lang = newLang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-it').classList.toggle('active', lang === 'it');
  document.documentElement.setAttribute('lang', lang);
  renderStaticText();
  renderCategoryBar();
  renderSourcesPanel();
  renderRatingLegend();
  renderIntakeList();
  renderGrid();
  renderLabQueue();
  if(openLotId){ renderModal(); renderCert(); }
  renderBreadcrumbs();
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').innerHTML = theme === 'dark' ? '&#9728;&#65039;' : '&#127769;';
  try{ localStorage.setItem('vi-proto-theme', theme); }catch(e){}
}
function toggleTheme(){
  var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
(function(){
  var saved = 'light';
  try{ saved = localStorage.getItem('vi-proto-theme') || 'light'; }catch(e){}
  applyTheme(saved);
})();

renderStaticText();
renderCategoryBar();
renderSourcesPanel();
renderRatingLegend();
renderIntakeList();
renderGrid();
renderLabQueue();
renderBreadcrumbs();
</script>
</body>
</html>
