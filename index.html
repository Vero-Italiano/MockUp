<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vero Italiano - Importer Prototype (A-G Spectrum + Sector Rules)</title>
<style>
  :root{
    --bg:#faf7f2;--card-bg:#ffffff;--ink:#1f2a24;--muted:#636e68;--line:#e4ded3;
    --green:#2f5d3a;--green-light:#e7f0e5;--blue:#2c6b8a;--blue-light:#e7f0f5;
    --gold:#b8862b;--gold-light:#f8efdb;--red-it:#b7312c;--red-light:#fbe7e6;
    --purple:#6b5b95;--purple-light:#efecf6;
    --panel-bg:#f1efe9;--shadow:0 4px 18px rgba(31,42,36,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14201a;--card-bg:#1c2b23;--ink:#eef2ee;--muted:#9fb0a5;--line:#2e4136;
      --green:#4f9464;--green-light:#22362a;--blue:#4a92b8;--blue-light:#1d323d;
      --gold:#d9a94b;--gold-light:#3a2f18;--red-it:#e2665f;--red-light:#A3a2220;
      --purple:#9b8ac4;--purple-light:#2b253a;
      --panel-bg:#233229;--shadow:0 4px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14201a;--card-bg:#1c2b23;--ink:#eef2ee;--muted:#9fb0a5;--line:#2e4136;
    --green:#4f9464;--green-light:#22362a;--blue:#4a92b8;--blue-light:#1d323d;
    --gold:#d9a94b;--gold-light:#3a2f18;--red-it:#e2665f;--red-light:#3a2220;
    --purple:#9b8ac4;--purple-light:#2b253a;
    --panel-bg:#233229;--shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:32px 20px;}
  .wrap{max-width:1220px;margin:0 auto;}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;}
  .h-left h1{font-size:22px;margin:0 0 4px;}
  .h-left p{color:var(--muted);font-size:13px;margin:0;max-width:670px;line-height:1.5;}
  .h-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .toggle,.lang-switch{display:flex;gap:4px;background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:3px;box-shadow:var(--shadow);}
  .toggle button,.lang-switch button{border:none;background:transparent;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;}
  .lang-switch button{padding:8px 12px;}
  .toggle button.active,.lang-switch button.active{background:var(--green);color:#fff;}
  .theme-toggle{border:1px solid var(--line);background:var(--card-bg);border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);}

  .ext-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;margin:0 0 14px;color:var(--muted);}
  .ext-nav a{color:var(--muted);text-decoration:none;font-weight:700;}
  .ext-nav a:hover{color:var(--green);}
  .ext-nav .ext-sep{color:var(--line);}
  .breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;margin:0 0 14px;color:var(--muted);}
  .breadcrumbs .crumb{color:var(--blue);text-decoration:none;cursor:pointer;}
  .breadcrumbs .crumb:hover{text-decoration:underline;}
  .breadcrumbs .crumb.current{color:var(--ink);font-weight:600;cursor:default;text-decoration:none;}
  .breadcrumbs .crumb-sep{color:var(--muted);opacity:.6;}

  .cat-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--card-bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);}
  .cat-tabs{display:flex;flex-wrap:wrap;gap:6px;}
  .cat-tab{border:1px solid var(--line);background:var(--panel-bg);color:var(--ink);border-radius:18px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .cat-tab:hover{border-color:var(--green);}
  .cat-tab.active{background:var(--green);color:#fff;border-color:var(--green);}
  .cat-count{font-size:10.5px;padding:1px 6px;border-radius:10px;background:rgba(0,0,0,0.08);}
  .cat-tab.active .cat-count{background:rgba(255,255,255,0.22);color:#fff;}
  .sources-toggle-btn{border:1px solid var(--blue);background:var(--blue-light);color:var(--blue);border-radius:18px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}

  .rating-legend{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .rl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .rl-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);}
  .rl-sub{font-size:11.5px;color:var(--muted);}
  .rl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px;}
  .rl-tier{background:var(--panel-bg);border-radius:10px;padding:8px 11px;border-left:4px solid var(--green);font-size:11.5px;line-height:1.42;}
  .rl-tier-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
  .rl-code{font-size:10.5px;font-weight:800;color:#fff;padding:2px 6px;border-radius:5px;min-width:22px;text-align:center;}
  .rl-name{font-weight:700;color:var(--ink);font-size:11.8px;}
  .rl-desc{color:var(--muted);}

  .sources-panel{display:none;background:var(--card-bg);border:1px solid var(--blue);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .sources-panel.open{display:block;}
  .sp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .sp-head h3{margin:0;font-size:14px;color:var(--blue);}
  .sp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;}
  .sp-card{background:var(--panel-bg);border-radius:10px;padding:11px 13px;border-left:3px solid var(--blue);font-size:12px;line-height:1.48;}
  .sp-card strong{display:block;color:var(--ink);font-size:12.5px;margin-bottom:3px;}
  .sp-card .sp-feeds{font-size:11px;color:var(--blue);font-weight:700;margin-bottom:4px;}
  .sp-card p{margin:0;color:var(--muted);}

  .badge-note{background:var(--panel-bg);border:1px dashed var(--line);border-radius:12px;padding:9px 14px;font-size:11.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;}
  .lot-card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .12s ease;display:flex;flex-direction:column;}
  .lot-card:hover{transform:translateY(-3px);}
  .lot-img-wrap{position:relative;height:142px;background:var(--panel-bg);display:flex;align-items:center;justify-content:center;padding:12px;border-bottom:1px solid var(--line);}
  .lot-shield{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:4px;}
  .custody-flag-pill{background:var(--purple);color:#fff;font-size:10px;font-weight:800;padding:3px 6px;border-radius:7px;letter-spacing:.02em;}
  .lot-cat-pill{position:absolute;bottom:8px;left:8px;background:var(--card-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:10px;font-weight:700;}
  .lot-lab-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--card-bg);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .lot-body{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1;}
  .lot-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:3px;}
  .lot-title{font-size:13.5px;font-weight:700;line-height:1.35;margin-bottom:8px;}
  .lot-status-row{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);}
  .lot-status-label{font-size:10px;color:var(--muted);margin-left:auto;font-weight:600;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .dot.confirmed{background:var(--green);}
  .dot.flagged{background:var(--red-it);}
  .dot.pending{background:var(--gold);}
  .dot.na{background:var(--line);}

  .overlay{display:none;position:fixed;inset:0;background:rgba(20,32,26,0.55);align-items:center;justify-content:center;padding:20px;z-index:60;}
  .overlay.open{display:flex;}
  .modal{background:var(--card-bg);border-radius:16px;max-width:690px;width:100%;max-height:90vh;overflow-y:auto;padding:26px 28px;box-shadow:0 12px 40px rgba(0,0,0,0.32);position:relative;}
  .modal-close{position:absolute;top:14px;right:16px;border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);}
  .modal-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .modal-thumb{width:62px;height:62px;background:var(--panel-bg);border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .modal-shield{flex-shrink:0;display:flex;align-items:center;gap:6px;}
  .modal-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 3px;}
  .modal-title{font-size:17px;font-weight:700;margin:0;}
  .modal-desc{font-size:13px;color:var(--muted);line-height:1.55;margin:12px 0;}
  .modal-example{background:var(--panel-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px;}
  .modal-example strong{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}

  .custody-alert{background:var(--purple-light);border:1px solid var(--purple);border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.5;margin-bottom:14px;color:var(--ink);}
  .custody-alert strong{color:var(--purple);display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}

  .buyer-note{background:var(--blue-light);border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;font-size:11.5px;color:var(--ink);margin-top:14px;line-height:1.45;}

  .section-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:16px 0 8px;}
  .section-h:first-of-type{margin-top:0;}
  .po-table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel-bg);border-radius:10px;overflow:hidden;}
  .po-table td{padding:8px 12px;border-bottom:1px solid var(--line);}
  .po-table tr:last-child td{border-bottom:none;}
  .po-table td:first-child{color:var(--muted);width:38%;}

  .evidence-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .evidence-row:first-of-type{border-top:none;}
  .ev-dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .ev-body h5{margin:0 0 2px;font-size:12.5px;}
  .ev-source{font-size:11px;color:var(--blue);font-weight:700;margin:0 0 3px;}
  .ev-body p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;}
  .ev-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:8px;margin-left:auto;flex-shrink:0;height:fit-content;}
  .ev-status.confirmed{background:var(--green-light);color:var(--green);}
  .ev-status.flagged{background:var(--red-light);color:var(--red-it);}
  .ev-status.pending{background:var(--gold-light);color:var(--gold);}
  .ev-status.na{background:var(--panel-bg);color:var(--muted);}

  .lab-strip{margin-top:14px;background:linear-gradient(135deg,var(--gold-light),var(--panel-bg));border:1px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--ink);}
  .lab-strip.pend{border-color:var(--muted);background:var(--panel-bg);}
  .lab-strip strong{display:block;font-size:12.5px;margin-bottom:4px;color:var(--gold);}
  .lab-strip.pend strong{color:var(--muted);}

  .cert-btn{margin-top:16px;width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .cert{border:2px solid var(--green);border-radius:14px;padding:20px;margin-top:16px;background:var(--card-bg);}
  .cert-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
  .cert-head h4{margin:0;font-size:15px;}
  .cert-flag{font-size:11px;color:var(--muted);text-align:right;font-weight:700;}
  .cert-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);gap:10px;}
  .cert-row span:first-child{color:var(--muted);flex-shrink:0;}
  .cert-row span:last-child{text-align:right;font-weight:500;}

  .view{display:none;}
  .view.active{display:block;}
  .queue-card{background:var(--card-bg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;}
  .queue-top{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .queue-thumb{width:50px;height:50px;background:var(--panel-bg);border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .queue-title{font-size:13.5px;font-weight:700;}
  .queue-sub{font-size:11.5px;color:var(--muted);}
  .lab-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .lab-form label{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:block;margin-bottom:3px;font-weight:700;}
  .lab-form select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--bg);color:var(--ink);}
  .lab-form .full{grid-column:1/-1;}
  .submit-btn{margin-top:12px;background:var(--gold);color:#3a2a08;border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .empty-queue{color:var(--muted);font-size:13px;padding:30px 0;text-align:center;}
  .done-tag{background:var(--green-light);color:var(--green);font-size:11px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:8px;margin-left:auto;flex-shrink:0;}

  .intake-card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .intake-head{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;}
  .intake-thumb{width:44px;height:44px;background:var(--panel-bg);border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .intake-head-title{font-size:13.5px;font-weight:700;}
  .intake-head-sub{font-size:11.5px;color:var(--muted);}
  .intake-shield{flex-shrink:0;display:flex;align-items:center;gap:5px;}
  .intake-caret{margin-left:auto;color:var(--muted);font-size:13px;transition:transform .15s ease;flex-shrink:0;}
  .intake-card.open .intake-caret{transform:rotate(90deg);}
  .intake-body{display:none;padding:0 18px 18px;}
  .intake-card.open .intake-body{display:block;}
  .flow-note{font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-style:italic;}

  .pending-section-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:0 0 8px;}
  .pending-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .pending-row{display:flex;align-items:center;gap:12px;background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);}
  .pending-thumb{width:38px;height:38px;background:var(--panel-bg);border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pending-title{font-size:12.5px;font-weight:700;}
  .pending-sub{font-size:11px;color:var(--muted);}
  .pending-upload-btn{display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;margin-left:auto;background:var(--green);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .pending-upload-btn:disabled{background:var(--panel-bg);color:var(--muted);cursor:not-allowed;}
  .all-imported-note{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .empty-intake{border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .checking{color:var(--muted);font-style:italic;}
  .parsing-row{display:flex;align-items:center;gap:10px;padding:14px 0;color:var(--muted);font-size:12.5px;font-style:italic;}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--green);animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .just-imported{background:var(--green-light);color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:8px;margin-left:8px;}

  @media (max-width:680px){
    .lab-form{grid-template-columns:1fr;}
    .po-table td:first-child{width:46%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="ext-nav">
    <a href="https://vero-italiano.github.io/Vero-/" id="ext-nav-home"></a>
    <span class="ext-sep">&middot;</span>
    <a href="https://vero-italiano.github.io/Spettro-di-Autenticita/" id="ext-nav-spectrum"></a>
    <span class="ext-sep">&middot;</span>
    <a href="https://vero-italiano.github.io/MVP-/" id="ext-nav-mvp"></a>
  </nav>
  <header>
    <div class="h-left">
      <h1 id="t-h1"></h1>
      <p id="t-sub"></p>
    </div>
    <div class="h-right">
      <div class="lang-switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <button id="btn-it" onclick="setLang('it')">IT</button>
      </div>
      <div class="toggle">
        <button id="btn-intake" onclick="setView('intake')"></button>
        <button id="btn-importer" class="active" onclick="setView('importer')"></button>
        <button id="btn-lab" onclick="setView('lab')"></button>
      </div>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">&#127769;</button>
    </div>
  </header>

  <nav class="breadcrumbs" id="breadcrumbs"></nav>

  <div class="cat-bar">
    <div class="cat-tabs" id="cat-tabs"></div>
    <button class="sources-toggle-btn" id="sources-toggle-btn" onclick="toggleSourcesPanel()"></button>
  </div>

  <div class="sources-panel" id="sources-panel"></div>
  <div class="rating-legend" id="rating-legend"></div>
  <div class="badge-note" id="t-note"></div>

  <div id="view-intake" class="view">
    <div id="pending-section"></div>
    <div id="pending-list"></div>
    <div id="intake-list"></div>
  </div>

  <div id="view-importer" class="view active">
    <div class="grid" id="lot-grid"></div>
  </div>

  <div id="view-lab" class="view">
    <div id="lab-queue"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
var lang = "en";
var activeCategory = "all";
var openLotId = null;
var openIntakeId = null;
var currentView = "importer";
var sourcesPanelOpen = false;
var certOpen = false;

var ui = {
  en: {
    h1: "Vero Italiano - Importer Prototype (A-G Spectrum)",
    sub: "Vero Italiano identifies objectively what each lot really is across the 7-grade Authenticity Spectrum (A-G) and an independent Chain-of-Custody overlay, using 6 forensic and digital data streams. Whether to accept, re-price, or decline an order remains entirely in the hands of the buyer.",
    note: "Illustrative prototype data. Grades A through G describe supply-chain and compositional reality without prescribing a commercial buy/reject decision.",
    intakeBtn: "Intake & Validation",
    importerBtn: "Lot Classifications",
    labBtn: "Lab Partner View",
    sourcesBtnShow: "Inspect All 6 Information Sources",
    sourcesBtnHide: "Hide Information Sources",
    sourcesPanelTitle: "Full Set of 6 Information Sources Behind Every Classification",
    sourcesPanelClose: "Close",
    method: "Analytical Method",
    result: "Assay Finding",
    custody: "Chain of Custody & Accreditation",
    resultOptions: ["Consistent with declared origin & composition", "Inconsistent with declared origin or composition"],

function t(){ return ui[lang]; }
function statusClass(st){ return st === "verified" ? "confirmed" : st; }

function shieldSVG(color, grade, size){
  size = size || 36;
  var h = Math.round(size * 72 / 64);
  return '<svg viewBox="0 0 64 72" width="' + size + '" height="' + h + '"><path d="M32 2 L60 12 L60 34 C60 54 48 66 32 70 C16 66 4 54 4 34 L4 12 Z" fill="' + color + '" stroke="#1f2a24" stroke-opacity="0.18" stroke-width="2"/><text x="32" y="43" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff" font-family="-apple-system,Helvetica,Arial,sans-serif">' + grade + '</text></svg>';
}

function gradeBadgeHTML(lot, size){
  var flagPill = lot.custodyFlag ? '<span class="custody-flag-pill" title="' + t().custodyFlagTitle + '">! CUSTODY</span>' : '';
  return shieldSVG(lot.color, lot.grade, size) + flagPill;
}

function gradeText(lot){
  return "Grade " + lot.grade + (lot.custodyFlag ? " + Custody Flag (!)" : "");
}

function visibleLots(){
  return activeCategory === "all" ? lots : lots.filter(function(l){ return l.category === activeCategory; });
}

function viewLabel(){
  return currentView === "intake" ? t().intakeBtn : (currentView === "lab" ? t().labBtn : t().importerBtn);
}

function crumbGoView(){
  openIntakeId = null;
  closeModal();
  renderIntakeList();
  renderBreadcrumbs();
}

function crumbGoLot(){
  certOpen = false;
  renderCert();
  renderBreadcrumbs();
}

function renderBreadcrumbs(){
  var nav = document.getElementById("breadcrumbs");
  if(!nav) return;
  var crumbs = [];
  var anythingOpen = !!openLotId || (currentView === "intake" && !!openIntakeId);
  crumbs.push({label: viewLabel(), onclick: anythingOpen ? "crumbGoView()" : null});
  if(activeCategory !== "all"){
    crumbs.push({label: categories[activeCategory].label[lang], onclick: anythingOpen ? "crumbGoView()" : null});
  }
  if(currentView === "intake" && openIntakeId){
    var iLot = lots.find(function(l){ return l.id === openIntakeId; });
    if(iLot) crumbs.push({label: t().crumbPo.replace("{L}", iLot.po.lot), onclick: null});
  }
  if(openLotId){
    var lot = lots.find(function(l){ return l.id === openLotId; });
    if(lot){
      crumbs.push({label: gradeText(lot) + ": " + lot.tag[lang], onclick: certOpen ? "crumbGoLot()" : null});
      if(certOpen) crumbs.push({label: t().certTitle, onclick: null});
    }
  }
  nav.innerHTML = crumbs.map(function(c, i){
    if(i === crumbs.length - 1 || !c.onclick) return '<span class="crumb current">' + c.label + '</span>';
    return '<a href="#" class="crumb" onclick="event.preventDefault(); ' + c.onclick + '">' + c.label + '</a>';
  }).join('<span class="crumb-sep">&rsaquo;</span>');
}

function renderStaticText(){
  document.getElementById("t-h1").textContent = t().h1;
  document.getElementById("t-sub").textContent = t().sub;
  document.getElementById("t-note").textContent = t().note;
  document.getElementById("btn-intake").textContent = t().intakeBtn;
  document.getElementById("btn-importer").textContent = t().importerBtn;
  document.getElementById("btn-lab").textContent = t().labBtn;
  document.getElementById("ext-nav-home").textContent = t().navHome;
  document.getElementById("ext-nav-spectrum").textContent = t().navSpectrum;
  document.getElementById("ext-nav-mvp").textContent = t().navMvp;
  document.getElementById("sources-toggle-btn").textContent = sourcesPanelOpen ? t().sourcesBtnHide : t().sourcesBtnShow;
}

function renderCategoryBar(){
  var tabsEl = document.getElementById("cat-tabs");
  var order = ["all","tomato","olive","cheese","wine"];
  tabsEl.innerHTML = order.map(function(cid){
    var count = cid === "all" ? lots.length : lots.filter(function(l){ return l.category === cid; }).length;
    var activeCls = (activeCategory === cid) ? " active" : "";
    return '<button class="cat-tab' + activeCls + '" onclick="setCategory(\'' + cid + '\')">' + categories[cid].label[lang] + ' <span class="cat-count">' + count + '</span></button>';
  }).join("");
}

function renderRatingLegend(){
  var cat = categories[activeCategory];
  var el = document.getElementById("rating-legend");
  var tiersHtml = cat.tiers.map(function(tr){
    return '<div class="rl-tier" style="border-left-color:' + tr.color + ';"><div class="rl-tier-top"><span class="rl-code" style="background:' + tr.color + ';">' + tr.code + '</span><span class="rl-name">' + tr.name[lang] + '</span></div><div class="rl-desc">' + tr.desc[lang] + '</div></div>';
  }).join("");
  el.innerHTML = '<div class="rl-head"><div class="rl-title">' + cat.scaleTitle[lang] + '</div><div class="rl-sub">' + cat.scaleSub[lang] + '</div></div><div class="rl-grid">' + tiersHtml + '</div>';
}
