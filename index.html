<title>Vero Italiano - Importer Prototype</title>
<style>
  :root{
    --bg:#faf7f2;--card-bg:#ffffff;--ink:#1f2a24;--muted:#6b7570;--line:#e4ded3;
    --green:#2f5d3a;--green-light:#e7f0e5;--blue:#2c6b8a;--blue-light:#e7f0f5;
    --gold:#b8862b;--gold-light:#f8efdb;--red-it:#b7312c;--red-light:#fbe7e6;
    --panel-bg:#f1efe9;--shadow:0 4px 18px rgba(31,42,36,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14201a;--card-bg:#1c2b23;--ink:#eef2ee;--muted:#9fb0a5;--line:#2e4136;
      --green:#4f9464;--green-light:#22362a;--blue:#4a92b8;--blue-light:#1d323d;
      --gold:#d9a94b;--gold-light:#3a2f18;--red-it:#e2665f;--red-light:#3a2220;
      --panel-bg:#233229;--shadow:0 4px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14201a;--card-bg:#1c2b23;--ink:#eef2ee;--muted:#9fb0a5;--line:#2e4136;
    --green:#4f9464;--green-light:#22362a;--blue:#4a92b8;--blue-light:#1d323d;
    --gold:#d9a94b;--gold-light:#3a2f18;--red-it:#e2665f;--red-light:#3a2220;
    --panel-bg:#233229;--shadow:0 4px 18px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-block:32px;padding-inline:20px 20px;}
  .wrap{max-width:1180px;margin:0 auto;}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;}
  .h-left h1{font-size:22px;margin:0 0 4px;}
  .h-left p{color:var(--muted);font-size:13px;margin:0;max-width:620px;line-height:1.5;}
  .h-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .toggle, .lang-switch{display:flex;gap:4px;background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:3px;box-shadow:var(--shadow);}
  .toggle button, .lang-switch button{border:none;background:transparent;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;}
  .lang-switch button{padding:8px 12px;}
  .toggle button.active, .lang-switch button.active{background:var(--green);color:#fff;}
  .theme-toggle{border:1px solid var(--line);background:var(--card-bg);border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);}

  .breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;margin:0 0 14px;color:var(--muted);}
  .breadcrumbs .crumb{color:var(--blue);text-decoration:none;cursor:pointer;}
  .breadcrumbs .crumb:hover{text-decoration:underline;}
  .breadcrumbs .crumb.current{color:var(--ink);font-weight:600;cursor:default;text-decoration:none;}
  .breadcrumbs .crumb-sep{color:var(--muted);opacity:.6;}
  .badge-note{background:var(--panel-bg);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.5;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .lot-card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .12s ease;}
  .lot-card:hover{transform:translateY(-3px);}
  .lot-img-wrap{position:relative;height:150px;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;}
  .lot-img-wrap img{max-width:100%;max-height:130px;object-fit:contain;}
  .lot-shield{position:absolute;top:8px;left:8px;width:34px;}
  .lot-lab-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .lot-body{padding:12px 14px 14px;}
  .lot-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:3px;}
  .lot-title{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:6px;}
  .lot-status-row{display:flex;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .dot.confirmed{background:var(--green);}
  .dot.flagged{background:var(--red-it);}
  .dot.pending{background:var(--gold);}
  .dot.na{background:var(--line);}

  .overlay{display:none;position:fixed;inset:0;background:rgba(20,32,26,0.5);align-items:center;justify-content:center;padding:20px;z-index:60;}
  .overlay.open{display:flex;}
  .modal{background:var(--card-bg);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px;box-shadow:0 12px 40px rgba(0,0,0,0.3);position:relative;}
  .modal-close{position:absolute;top:14px;right:16px;border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);}
  .modal-top{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
  .modal-img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);padding:4px;}
  .modal-shield{width:44px;}
  .modal-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 3px;}
  .modal-title{font-size:17px;font-weight:700;margin:0;}
  .modal-desc{font-size:13px;color:var(--muted);line-height:1.55;margin:14px 0;}
  .modal-example{background:var(--panel-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;margin-bottom:16px;}
  .modal-example strong{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}

  .section-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:18px 0 8px;}
  .section-h:first-of-type{margin-top:0;}

  .po-table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel-bg);border-radius:10px;overflow:hidden;}
  .po-table td{padding:8px 12px;border-bottom:1px solid var(--line);}
  .po-table tr:last-child td{border-bottom:none;}
  .po-table td:first-child{color:var(--muted);width:42%;}

  .evidence-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .evidence-row:first-of-type{border-top:none;}
  .ev-dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .ev-body h5{margin:0 0 2px;font-size:12.5px;}
  .ev-source{font-size:10.5px;color:var(--blue);font-weight:700;margin:0 0 3px;}
  .ev-body p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;}
  .ev-status{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:8px;margin-left:auto;flex-shrink:0;height:fit-content;}
  .ev-status.confirmed{background:var(--green-light);color:var(--green);}
  .ev-status.flagged{background:var(--red-light);color:var(--red-it);}
  .ev-status.pending{background:var(--gold-light);color:var(--gold);}
  .ev-status.na{background:var(--panel-bg);color:var(--muted);}

  .lab-strip{margin-top:16px;background:linear-gradient(135deg,var(--gold-light),var(--panel-bg));border:1px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--ink);}
  .lab-strip.pend{border-color:var(--muted);background:var(--panel-bg);}
  .lab-strip strong{display:block;font-size:12.5px;margin-bottom:4px;color:var(--gold);}
  .lab-strip.pend strong{color:var(--muted);}

  .cert-btn{margin-top:18px;width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .cert-btn:hover{opacity:.92;}

  .cert{border:2px solid var(--green);border-radius:14px;padding:22px;margin-top:16px;background:var(--card-bg);}
  .cert-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .cert-head h4{margin:0;font-size:15px;}
  .cert-flag{font-size:11px;color:var(--muted);text-align:right;}
  .cert-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);gap:10px;}
  .cert-row span:first-child{color:var(--muted);flex-shrink:0;}
  .cert-row span:last-child{text-align:right;}

  .view{display:none;}
  .view.active{display:block;}

  .queue-card{background:var(--card-bg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;}
  .queue-top{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .queue-img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);padding:4px;flex-shrink:0;}
  .queue-title{font-size:13.5px;font-weight:700;}
  .queue-sub{font-size:11.5px;color:var(--muted);}
  .lab-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .lab-form label{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:block;margin-bottom:3px;}
  .lab-form select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--bg);color:var(--ink);}
  .lab-form .full{grid-column:1/-1;}
  .submit-btn{margin-top:12px;background:var(--gold);color:#3a2a08;border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .empty-queue{color:var(--muted);font-size:13px;padding:30px 0;text-align:center;}
  .done-tag{background:var(--green-light);color:var(--green);font-size:11px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:8px;margin-left:auto;flex-shrink:0;}

  /* Intake view */
  .intake-card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .intake-head{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;}
  .intake-img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);padding:3px;flex-shrink:0;}
  .intake-head-title{font-size:13.5px;font-weight:700;}
  .intake-head-sub{font-size:11.5px;color:var(--muted);}
  .intake-shield{width:28px;flex-shrink:0;}
  .intake-caret{margin-left:auto;color:var(--muted);font-size:13px;transition:transform .15s ease;flex-shrink:0;}
  .intake-card.open .intake-caret{transform:rotate(90deg);}
  .intake-body{display:none;padding:0 18px 18px;}
  .intake-card.open .intake-body{display:block;}
  .flow-note{font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-style:italic;}

  .upload-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--green);color:#fff;border:none;border-radius:12px;padding:16px;
    font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .upload-btn:disabled{background:var(--panel-bg);color:var(--muted);cursor:not-allowed;box-shadow:none;}
  .upload-btn:not(:disabled):hover{opacity:.92;}
  .empty-intake{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .checking{color:var(--muted);font-style:italic;}
  .parsing-row{display:flex;align-items:center;gap:10px;padding:14px 0;color:var(--muted);font-size:12.5px;font-style:italic;}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--green);animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .just-imported{background:var(--green-light);color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:8px;margin-left:8px;}

  @media (max-width:640px){
    .lab-form{grid-template-columns:1fr;}
    .po-table td:first-child{width:50%;}
  }
</style>

<div class="wrap">
  <header>
    <div class="h-left">
      <h1 id="t-h1"></h1>
      <p id="t-sub"></p>
    </div>
    <div class="h-right">
      <div class="lang-switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <button id="btn-it" onclick="setLang('it')">IT</button>
      </div>
      <div class="toggle">
        <button id="btn-intake" onclick="setView('intake')"></button>
        <button id="btn-importer" class="active" onclick="setView('importer')"></button>
        <button id="btn-lab" onclick="setView('lab')"></button>
      </div>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">&#127769;</button>
    </div>
  </header>

  <nav class="breadcrumbs" id="breadcrumbs"></nav>

  <div class="badge-note" id="t-note"></div>

  <div id="view-intake" class="view">
    <button class="upload-btn" id="upload-btn" onclick="uploadPO()"></button>
    <div id="intake-list"></div>
  </div>

  <div id="view-importer" class="view active">
    <div class="grid" id="lot-grid"></div>
  </div>

  <div id="view-lab" class="view">
    <div id="lab-queue"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modal-content"></div>
  </div>
</div>

  size = size || 34;
  var h = Math.round(size * 72 / 64);
  return '<svg viewBox="0 0 64 72" width="' + size + '" height="' + h + '">' +
    '<path d="M32 2 L60 12 L60 34 C60 54 48 66 32 70 C16 66 4 54 4 34 L4 12 Z" fill="' + color + '" stroke="#1f2a24" stroke-opacity="0.15" stroke-width="2"/>' +
    '<text x="32" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff" font-family="-apple-system,Helvetica,Arial,sans-serif">' + letter + '</text>' +
    '</svg>';
}

function viewLabel(){
  return currentView === 'intake' ? t().intakeBtn : (currentView === 'lab' ? t().labBtn : t().importerBtn);
}

function crumbGoView(){
  openIntakeId = null;
  closeModal();
  renderIntakeList();
  renderBreadcrumbs();
}
function crumbGoLot(){
  certOpen = false;
  renderCert();
  renderBreadcrumbs();
}

function renderBreadcrumbs(){
  var nav = document.getElementById('breadcrumbs');
  if(!nav) return;
  var crumbs = [];
  var anythingOpen = !!openLotId || (currentView === 'intake' && !!openIntakeId);
  crumbs.push({label: viewLabel(), onclick: anythingOpen ? 'crumbGoView()' : null});

  if(currentView === 'intake' && openIntakeId){
    var iLot = lots.find(function(l){ return l.id === openIntakeId; });
    if(iLot){ crumbs.push({label: t().crumbPo.replace('{L}', iLot.po.lot), onclick: null}); }
  }
  if(openLotId){
    var lot = lots.find(function(l){ return l.id === openLotId; });
    if(lot){
      crumbs.push({label: 'Grade ' + lot.letter + ': ' + lot.tag[lang], onclick: certOpen ? 'crumbGoLot()' : null});
      if(certOpen){ crumbs.push({label: t().certTitle, onclick: null}); }
    }
  }

  nav.innerHTML = crumbs.map(function(c, i){
    var isLast = (i === crumbs.length - 1);
    if(isLast || !c.onclick){
      return '<span class="crumb current">' + c.label + '</span>';
    }
    return '<a href="#" class="crumb" onclick="event.preventDefault(); ' + c.onclick + '">' + c.label + '</a>';
  }).join('<span class="crumb-sep">&rsaquo;</span>');
}

function renderStaticText(){
  document.getElementById('t-h1').textContent = t().h1;
  document.getElementById('t-sub').textContent = t().sub;
  document.getElementById('t-note').textContent = t().note;
  document.getElementById('btn-intake').textContent = t().intakeBtn;
  document.getElementById('btn-importer').textContent = t().importerBtn;
  document.getElementById('btn-lab').textContent = t().labBtn;
}

/* ---------- Intake & Validation view ---------- */
function renderUploadBtn(){
  var btn = document.getElementById('upload-btn');
  var busy = (parsingId !== null || revealingId !== null);
  if(importIndex >= lots.length){
    btn.textContent = t().allImported;
    btn.disabled = true;
  } else {
    btn.innerHTML = t().uploadBtn;
    btn.disabled = busy;
  }
}

function renderIntakeList(){
  renderUploadBtn();
  var container = document.getElementById('intake-list');
  if(importedIds.length === 0){
    container.innerHTML = '<div class="empty-intake">' + t().emptyIntake + '</div>';
    return;
  }
  container.innerHTML = '';
  importedIds.forEach(function(id){
    var lot = lots.find(function(l){ return l.id === id; });
    var card = document.createElement('div');
    card.className = 'intake-card' + (openIntakeId === lot.id ? ' open' : '');
    var justTag = (id === importedIds[0] && (revealingId === id || parsingId === id)) ? '<span class="just-imported">' + t().justImported + '</span>' : '';
    var headHtml =
      '<div class="intake-head" onclick="toggleIntake(\'' + lot.id + '\')">' +
        '<img class="intake-img" src="' + lot.img + '" alt="">' +
        '<div><div class="intake-head-title">' + lot.title[lang] + justTag + '</div><div class="intake-head-sub">PO ' + lot.po.lot + ' &middot; ' + t().clickToExpand + '</div></div>' +
        '<div class="intake-shield">' + shieldSVG(lot.color, lot.letter, 28) + '</div>' +
        '<span class="intake-caret">&#9654;</span>' +
      '</div>';
    var bodyHtml = '<div class="intake-body">' + intakeBodyHTML(lot) + '</div>';
    card.innerHTML = headHtml + bodyHtml;
    container.appendChild(card);
  });
}

function toggleIntake(id){
  openIntakeId = (openIntakeId === id) ? null : id;
  renderIntakeList();
  renderBreadcrumbs();
}

function intakeBodyHTML(lot){
  if(parsingId === lot.id){
    return '<div class="parsing-row"><span class="spin"></span>' + t().parsing + '</div>';
  }
  var po = lot.po;
  var poRows = [
    [t().poProduct, po.product[lang]],
    [t().poVolume, po.volume[lang]],
    [t().poOrigin, po.origin[lang]],
    [t().poLot, po.lot],
    [t().poHs, po.hs],
    [t().poSupplier, po.supplier]
  ].map(function(r){ return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');

  var isRevealing = (revealingId === lot.id);
  var reqRows = ['doc','sat','custody','lab'].map(function(k){
    var e = lot.evidence[k];
    if(isRevealing && checkedKeys.indexOf(k) === -1){
      return '<div class="evidence-row"><span class="ev-dot dot pending"></span>' +
        '<div class="ev-body"><h5>' + e.label[lang] + '</h5><p class="checking">' + t().checking + '</p></div></div>';
    }
    var cls = statusClass(e.status);
    return '<div class="evidence-row"><span class="ev-dot dot ' + cls + '"></span>' +
      '<div class="ev-body"><h5>' + e.label[lang] + '</h5><div class="ev-source">' + e.source[lang] + '</div><p>' + e.note[lang] + '</p></div>' +
      '<span class="ev-status ' + cls + '">' + t().statusLabel[e.status] + '</span></div>';
  }).join('');

  var resultHtml;
  if(isRevealing && checkedKeys.length < 4){
    resultHtml = '';
  } else {
    var resultText = t().resultLine.replace('{L}', lot.letter).replace('{T}', lot.tag[lang]);
    resultHtml = '<div class="section-h">' + t().resultSection + '</div>' +
      '<div class="modal-example" style="display:flex;align-items:center;gap:12px;margin-bottom:0;">' +
        '<div style="width:30px;flex-shrink:0;">' + shieldSVG(lot.color, lot.letter, 30) + '</div>' +
        '<span>' + resultText + '</span>' +
      '</div>' +
      '<div class="flow-note"><a href="#" onclick="event.preventDefault(); openModal(\'' + lot.id + '\');">' + t().openInResults + '</a></div>';
  }

  return '<div class="section-h">' + t().poSection + '</div>' +
    '<table class="po-table">' + poRows + '</table>' +
    '<div class="section-h">' + t().reqSection + '</div>' +
    reqRows +
    resultHtml;
}

function uploadPO(){
  if(importIndex >= lots.length) return;
  var lot = lots[importIndex];
  importIndex++;
  importedIds.unshift(lot.id);
  openIntakeId = lot.id;
  parsingId = lot.id;
  revealingId = null;
  checkedKeys = [];
  renderIntakeList();
  renderBreadcrumbs();
  setTimeout(function(){
    parsingId = null;
    revealingId = lot.id;
    renderIntakeList();
    revealNext(lot.id, ['doc','sat','custody','lab'], 0);
  }, 900);
}

function revealNext(lotId, keys, idx){
  if(idx >= keys.length){
    revealingId = null;
    renderIntakeList();
    return;
  }
  checkedKeys.push(keys[idx]);
  renderIntakeList();
  setTimeout(function(){ revealNext(lotId, keys, idx + 1); }, 550);
}

/* ---------- Certified Results (importer) view ---------- */
function renderGrid(){
  var grid = document.getElementById('lot-grid');
  grid.innerHTML = '';
  lots.forEach(function(lot){
    var card = document.createElement('div');
    card.className = 'lot-card';
    card.onclick = function(){ openModal(lot.id); };
    var labBadge = lot.evidence.lab.status === 'verified' ? '<div class="lot-lab-badge" title="' + t().labVerified + '">&#129514;</div>' : '';
    var dots = ['doc','sat','custody','lab'].map(function(k){
      var st = lot.evidence[k].status;
      return '<span class="dot ' + statusClass(st) + '" title="' + lot.evidence[k].label[lang] + ': ' + t().statusLabel[st] + '"></span>';
    }).join('');
    card.innerHTML =
      '<div class="lot-img-wrap"><div class="lot-shield">' + shieldSVG(lot.color, lot.letter) + '</div>' + labBadge + '<img src="' + lot.img + '" alt=""></div>' +
      '<div class="lot-body">' +
        '<div class="lot-tag">Grade ' + lot.letter + ' &middot; ' + lot.tag[lang] + '</div>' +
        '<div class="lot-title">' + lot.title[lang] + '</div>' +
        '<div class="lot-status-row">' + dots + '</div>' +
      '</div>';
    grid.appendChild(card);
  });
}

function evidenceRowsHTML(lot){
  return ['doc','sat','custody','lab'].map(function(k){
    var e = lot.evidence[k];
    var cls = statusClass(e.status);
    return '<div class="evidence-row"><span class="ev-dot dot ' + cls + '"></span>' +
      '<div class="ev-body"><h5>' + e.label[lang] + '</h5><div class="ev-source">' + e.source[lang] + '</div><p>' + e.note[lang] + '</p></div>' +
      '<span class="ev-status ' + cls + '">' + t().statusLabel[e.status] + '</span></div>';
  }).join('');
}

function openModal(id){
  openLotId = id;
  certOpen = false;
  renderModal();
  document.getElementById('overlay').classList.add('open');
  renderBreadcrumbs();
}

function renderModal(){
  if(!openLotId) return;
  var lot = lots.find(function(l){ return l.id === openLotId; });
  var body = document.getElementById('modal-content');
  var labBadgeHtml = lot.evidence.lab.status === 'verified'
    ? '<div class="lab-strip"><strong>&#129514; ' + t().labVerified + '</strong>' + lot.evidence.lab.note[lang] + '</div>'
    : (lot.evidence.lab.status === 'pending'
      ? '<div class="lab-strip pend"><strong>&#8987; ' + t().labPending + '</strong>' + lot.evidence.lab.note[lang] + '</div>'
      : '');

  body.innerHTML =
    '<div class="modal-top">' +
      '<img class="modal-img" src="' + lot.img + '" alt="">' +
      '<div class="modal-shield">' + shieldSVG(lot.color, lot.letter, 44) + '</div>' +
      '<div><div class="modal-tag">Grade ' + lot.letter + ' &middot; ' + lot.tag[lang] + '</div><h3 class="modal-title">' + lot.title[lang] + '</h3></div>' +
    '</div>' +
    '<p class="modal-desc">' + lot.desc[lang] + '</p>' +
    '<div class="modal-example"><strong>' + t().context + '</strong>' + lot.example[lang] + '</div>' +
    evidenceRowsHTML(lot) +
    labBadgeHtml +
    '<button class="cert-btn" id="cert-toggle-btn" onclick="toggleCert()">' + t().viewCert + '</button>' +
    '<div id="cert-area"></div>';
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  openLotId = null;
  renderBreadcrumbs();
}
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id === 'overlay') closeModal(); });

var certOpen = false;
function toggleCert(){
  certOpen = !certOpen;
  renderCert();
  renderBreadcrumbs();
  if(certOpen){
    setTimeout(function(){
      var area = document.getElementById('cert-area');
      if(area) area.scrollIntoView({behavior:'smooth', block:'start'});
    }, 30);
  }
}
function renderCert(){
  var area = document.getElementById('cert-area');
  var btn = document.getElementById('cert-toggle-btn');
  if(!area) return;
  if(!certOpen){ area.innerHTML = ''; if(btn) btn.textContent = t().viewCert; return; }
  if(btn) btn.textContent = t().hideCert;
  var lot = lots.find(function(l){ return l.id === openLotId; });
  if(!lot) return;
  var overallStatus = (lot.evidence.doc.status === 'flagged' || lot.evidence.sat.status === 'flagged' || lot.evidence.custody.status === 'flagged') ? t().discrepancies : t().noDiscrepancies;
  var anchorHash = certHash(lot);
  area.innerHTML =
    '<div class="cert">' +
      '<div class="cert-head"><h4>' + t().certTitle + '</h4><span class="cert-flag">' + overallStatus + '</span></div>' +
      '<div class="cert-row"><span>' + t().certProduct + '</span><span>' + lot.title[lang] + '</span></div>' +
      '<div class="cert-row"><span>' + t().certLevel + '</span><span>Grade ' + lot.letter + ', ' + lot.tag[lang] + '</span></div>' +
      '<div class="cert-row"><span>' + t().certDoc + '</span><span>' + t().statusLabel[lot.evidence.doc.status] + '</span></div>' +
      '<div class="cert-row"><span>' + t().certSat + '</span><span>' + t().statusLabel[lot.evidence.sat.status] + '</span></div>' +
      '<div class="cert-row"><span>' + t().certCustody + '</span><span>' + t().statusLabel[lot.evidence.custody.status] + '</span></div>' +
      '<div class="cert-row"><span>' + t().certLab + '</span><span>' + (lot.evidence.lab.status === 'verified' ? t().certYes : t().certNo) + '</span></div>' +
      '<div class="cert-row"><span>' + t().certIssued + '</span><span>' + t().certIssuedNote + '</span></div>' +
      '<div class="cert-row" style="border-bottom:none;"><span>' + t().certAnchor + '</span><span style="font-family:monospace;font-size:12px;" title="' + t().certAnchorNote + '">' + anchorHash + '</span></div>' +
    '</div>';
}

function certHash(lot){
  var src = lot.id + '|' + lot.letter + '|' + lot.po.lot + '|' + lot.evidence.doc.status + '|' + lot.evidence.sat.status + '|' + lot.evidence.custody.status + '|' + lot.evidence.lab.status;
  var h = 0;
  for(var i = 0; i < src.length; i++){ h = ((h << 5) - h + src.charCodeAt(i)) | 0; }
  var hex = (h >>> 0).toString(16);
  while(hex.length < 8){ hex = '0' + hex; }
  return '0x' + hex + '...' + lot.po.lot.replace(/[^A-Za-z0-9]/g,'').slice(-6).toLowerCase();
}

/* ---------- Lab Partner view ---------- */
function renderLabQueue(){
  var container = document.getElementById('lab-queue');
  var pending = lots.filter(function(l){ return l.evidence.lab.status === 'pending'; });
  var verified = lots.filter(function(l){ return l.evidence.lab.status === 'verified'; });

  var html = '';
  if(pending.length === 0 && verified.length === 0){
    html += '<div class="empty-queue">' + t().emptyQueue + '</div>';
  }
  pending.forEach(function(lot){
    var subText = t().testRequested.replace('{L}', lot.letter);
    html +=
      '<div class="queue-card">' +
        '<div class="queue-top">' +
          '<img class="queue-img" src="' + lot.img + '" alt="">' +
          '<div><div class="queue-title">' + lot.title[lang] + '</div><div class="queue-sub">' + subText + '</div></div>' +
        '</div>' +
        '<div class="lab-form">' +
          '<div><label>' + t().method + '</label><select id="method-' + lot.id + '">' + t().methodOptions.map(function(o){ return '<option>' + o + '</option>'; }).join('') + '</select></div>' +
          '<div><label>' + t().result + '</label><select id="result-' + lot.id + '">' + t().resultOptions.map(function(o){ return '<option>' + o + '</option>'; }).join('') + '</select></div>' +
          '<div class="full"><label>' + t().custody + '</label><select id="custody-' + lot.id + '">' + t().custodyOptions.map(function(o){ return '<option>' + o + '</option>'; }).join('') + '</select></div>' +
        '</div>' +
        '<button class="submit-btn" onclick="submitLabResult(\'' + lot.id + '\')">' + t().submitBtn + '</button>' +
      '</div>';
  });
  verified.forEach(function(lot){
    html +=
      '<div class="queue-card" style="border-left-color:var(--green);opacity:.75;">' +
        '<div class="queue-top">' +
          '<img class="queue-img" src="' + lot.img + '" alt="">' +
          '<div><div class="queue-title">' + lot.title[lang] + '</div><div class="queue-sub">Grade ' + lot.letter + '</div></div>' +
          '<span class="done-tag">' + t().submitted + '</span>' +
        '</div>' +
      '</div>';
  });
  container.innerHTML = html;
}

function submitLabResult(id){
  var lot = lots.find(function(l){ return l.id === id; });
  var resultSelect = document.getElementById('result-' + id);
  var custodySelect = document.getElementById('custody-' + id);
  var methodSelect = document.getElementById('method-' + id);
  var resultIdx = resultSelect.selectedIndex;
  var custodyIdx = custodySelect.selectedIndex;
  var methodIdx = methodSelect.selectedIndex;
  var consistent = (resultIdx === 0);
  var confirmed = (custodyIdx === 0);
  var methodText = t().methodOptions[methodIdx];
  if(consistent && confirmed){
    lot.evidence.lab.status = 'verified';
    lot.evidence.lab.note = {
      en: methodText + " confirms result consistent with declared origin. Chain of custody confirmed.",
      it: methodText + " conferma un risultato coerente con l'origine dichiarata. Catena di custodia confermata."
    };
  } else {
    lot.evidence.lab.status = 'flagged';
    lot.evidence.lab.note = {
      en: methodText + " result: " + t().resultOptions[resultIdx].toLowerCase() + ". Custody: " + t().custodyOptions[custodyIdx].toLowerCase() + ".",
      it: methodText + ", risultato: " + t().resultOptions[resultIdx].toLowerCase() + ". Custodia: " + t().custodyOptions[custodyIdx].toLowerCase() + "."
    };
  }
  renderLabQueue();
  renderGrid();
  if(openIntakeId === id) renderIntakeList();
}

/* ---------- View / lang / theme switching ---------- */
function setView(view){
  currentView = view;
  ['intake','importer','lab'].forEach(function(v){
    document.getElementById('view-' + v).classList.toggle('active', v === view);
    document.getElementById('btn-' + v).classList.toggle('active', v === view);
  });
  renderBreadcrumbs();
}

function setLang(newLang){
  lang = newLang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-it').classList.toggle('active', lang === 'it');
  document.documentElement.setAttribute('lang', lang);
  renderStaticText();
  renderIntakeList();
  renderGrid();
  renderLabQueue();
  if(openLotId){ renderModal(); renderCert(); }
  renderBreadcrumbs();
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').innerHTML = theme === 'dark' ? '&#9728;&#65039;' : '&#127769;';
  try{ localStorage.setItem('vi-proto-theme', theme); }catch(e){}
}
function toggleTheme(){
  var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
(function(){
  var saved = 'light';
  try{ saved = localStorage.getItem('vi-proto-theme') || 'light'; }catch(e){}
  applyTheme(saved);
})();

renderStaticText();
renderIntakeList();
renderGrid();
renderLabQueue();
renderBreadcrumbs();
</script>
